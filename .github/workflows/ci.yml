name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: grdrl check
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            node dist/cli.js check --policy-ref "${{ github.event.pull_request.base.sha }}"
          else
            node dist/cli.js check
          fi
